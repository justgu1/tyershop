# Gerador de carga dentro do cluster. Variáveis entre ${...} são preenchidas por run-in-cluster.sh (envsubst).
apiVersion: batch/v1
kind: Job
metadata:
  name: loadtest-k6
  namespace: apps
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          args: ["run", "/scripts/load.js"]
          env:
            - { name: FRONT_URL, value: "${FRONT_URL}" }
            - { name: API_URL, value: "${API_URL}" }
            - { name: PUBLISHABLE_KEY, value: "${PUBLISHABLE_KEY}" }
            - { name: PROFILE, value: "${PROFILE}" }
            - { name: PEOPLE, value: "${PEOPLE}" }
            - { name: HOLD_SECONDS, value: "${HOLD_SECONDS}" }
            - { name: THINK_SCALE, value: "${THINK_SCALE}" }
            - { name: USERS, value: "${USERS}" }
            - { name: STEP_SECONDS, value: "${STEP_SECONDS}" }
            - { name: LEVELS, value: "${LEVELS}" }
            - { name: I_UNDERSTAND_THIS_CREATES_ORDERS, value: "yes" }
            - { name: ALLOW_TYERSHOP_HOST, value: "yes" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 3Gi }
          volumeMounts: [{ name: script, mountPath: /scripts }]
      volumes:
        - name: script
          configMap: { name: loadtest-k6 }
