apiVersion: apps/v1
kind: Deployment
metadata:
  name: tyershop-frontend
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tyershop-frontend
  template:
    metadata:
      labels:
        app: tyershop-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/justgu1/tyershop-frontend:latest
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PUBLIC_MEDUSA_URL
              value: "https://medusa.hg.tyershop.com"
            - name: MEDUSA_INTERNAL_URL
              value: "http://tyershop-backend.apps.svc.cluster.local:9000"
            - name: MEDUSA_URL
              value: "http://tyershop-backend.apps.svc.cluster.local:9000"
            - name: PUBLIC_API_URL
              value: "https://api.hg.tyershop.com"
            - name: PUBLIC_MEDUSA_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: PUBLIC_MEDUSA_PUBLISHABLE_KEY
            - name: PUBLIC_MEDUSA_REGION_ID
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: PUBLIC_MEDUSA_REGION_ID
            - name: PUBLIC_MERCADOPAGO_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: PUBLIC_MERCADOPAGO_PUBLIC_KEY
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tyershop-frontend
  namespace: apps
spec:
  selector:
    app: tyershop-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
