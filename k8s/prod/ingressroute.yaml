apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tyershop-tls
spec:
  entryPoints:
    - websecure
  routes:
    # /store e /auth no mesmo domínio do frontend: o fetch relativo do cliente cai no backend (vem antes da rota geral).
    - match: (Host(`tyershop.com`) || Host(`www.tyershop.com`)) && (PathPrefix(`/store`) || PathPrefix(`/auth`))
      kind: Rule
      services:
        - name: tyershop-backend
          port: 9000
    - match: Host(`tyershop.com`) || Host(`www.tyershop.com`)
      kind: Rule
      services:
        - name: tyershop-frontend
          port: 80
    - match: Host(`medusa.tyershop.com`)
      kind: Rule
      services:
        - name: tyershop-backend
          port: 9000
    - match: Host(`api.tyershop.com`)
      kind: Rule
      services:
        - name: tyershop-api
          port: 3000
  tls:
    certResolver: letsencrypt
