apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Produção (namespace tyershop-prod). Parte de ../base e troca hosts, URLs internas, bucket e credenciais.
namespace: tyershop-prod

resources:
  - ../base
  - sealed-secret.yaml
  - melhor-envio-config.yaml
  - ingressroute.yaml

patches:
  - path: backend.yaml
  - path: frontend.yaml
  - path: api.yaml

# Promoção manual: troque `latest` por `sha-<commit>` da imagem já validada em homologação.
images:
  - name: ghcr.io/justgu1/tyershop-backend
    newTag: latest
  - name: ghcr.io/justgu1/tyershop-frontend
    newTag: latest
  - name: ghcr.io/justgu1/tyershop-api
    newTag: latest
