apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tyershop-tls
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    # /store e /auth no MESMO domínio do frontend → backend Medusa. Em dev
    # local isso é o proxy do Vite (astro.config.mjs); em produção não tem
    # Vite, então o cliente (fetch relativo tipo `/store/carts`) quebra sem
    # essa rota — precisa vir ANTES da rota geral do frontend abaixo.
    - match: Host(`homolog.tyershop.com`) && (PathPrefix(`/store`) || PathPrefix(`/auth`))
      kind: Rule
      services:
        - name: tyershop-backend
          port: 9000
    - match: Host(`homolog.tyershop.com`)
      kind: Rule
      services:
        - name: tyershop-frontend
          port: 80
    - match: Host(`medusa.homolog.tyershop.com`)
      kind: Rule
      services:
        - name: tyershop-backend
          port: 9000
    - match: Host(`api.homolog.tyershop.com`)
      kind: Rule
      services:
        - name: tyershop-api
          port: 3000
  tls:
    certResolver: letsencrypt
