apiVersion: apps/v1
kind: Deployment
metadata:
  name: tyershop-backend
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tyershop-backend
  template:
    metadata:
      labels:
        app: tyershop-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/justgu1/tyershop-backend:latest
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: BACKEND_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: BACKEND_REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: JWT_SECRET
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: COOKIE_SECRET
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: MERCADOPAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MERCADOPAGO_ACCESS_TOKEN
            - name: PUBLIC_MERCADOPAGO_PUBLIC_KEY
              # Mesma chave do secret usado pelo frontend (tyershop-secrets) — fonte única.
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: PUBLIC_MERCADOPAGO_PUBLIC_KEY
            - name: MERCADOPAGO_NOTIFICATION_URL
              value: "https://medusa.homolog.tyershop.com/hooks/payment/mercadopago"
            - name: STORE_CORS
              value: "https://homolog.tyershop.com"
            - name: ADMIN_CORS
              value: "https://medusa.homolog.tyershop.com"
            - name: AUTH_CORS
              value: "https://homolog.tyershop.com,https://medusa.homolog.tyershop.com"
            - name: AWS_BUCKET
              value: tyershop
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              value: tyershop
            - name: AWS_ENDPOINT
              value: http://minio.shared.svc.cluster.local:9000
            - name: AWS_URL
              # URL interna do cluster não abre no navegador do cliente —
              # bucket tyershop é público, exposto via /cdn na api
              value: https://api.homolog.tyershop.com/cdn/tyershop
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: tyershop-backend
  namespace: apps
spec:
  selector:
    app: tyershop-backend
  ports:
    - name: http
      port: 9000
      targetPort: http
