apiVersion: apps/v1
kind: Deployment
metadata:
  name: tyershop-backend
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tyershop-backend
  template:
    metadata:
      labels:
        app: tyershop-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/justgu1/tyershop-backend:latest
          resources:
            requests: { cpu: 250m, memory: 768Mi }
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: BACKEND_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: BACKEND_REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: JWT_SECRET
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: COOKIE_SECRET
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: MERCADOPAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MERCADOPAGO_ACCESS_TOKEN
            - name: PUBLIC_MERCADOPAGO_PUBLIC_KEY
              # Mesma chave do secret usado pelo frontend (tyershop-secrets) — fonte única.
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: PUBLIC_MERCADOPAGO_PUBLIC_KEY
            - name: MERCADOPAGO_NOTIFICATION_URL
              value: "https://medusa.homolog.tyershop.com/hooks/payment/mercadopago"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: SMTP_PASSWORD
                  optional: true
            - name: SMTP_FROM
              value: "Tyer <suporte@tyershop.com>"
            # Ligado por padrão: homolog e prod são o mesmo deploy, nada sai para cliente real sem desligar aqui.
            # Multiplicador dos limites de requisição, lido de um ConfigMap que só existe durante uma janela de teste (kubectl, fora do git).
            - name: RATE_LIMIT_SCALE
              valueFrom:
                configMapKeyRef:
                  name: tyershop-janela-de-teste
                  key: RATE_LIMIT_SCALE
                  optional: true
            - name: EMAIL_TEST_MODE
              value: "true"
            - name: EMAIL_TEST_TO
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: EMAIL_TEST_TO
                  optional: true
            - name: SITE_URL
              value: "https://homolog.tyershop.com"
            # Segredo de assinatura das notificações do Mercado Pago (opcional até ser criado no painel).
            - name: MERCADOPAGO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MERCADOPAGO_WEBHOOK_SECRET
                  optional: true
            # Melhor Envio (cálculo de frete). Client id/secret entram no secret; sandbox até a virada.
            - name: MELHOR_ENVIO_ENV
              value: "sandbox"
            - name: MELHOR_ENVIO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MELHOR_ENVIO_CLIENT_ID
                  optional: true
            - name: MELHOR_ENVIO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MELHOR_ENVIO_CLIENT_SECRET
                  optional: true
            - name: MELHOR_ENVIO_REDIRECT_URI
              value: "https://homolog.tyershop.com/melhor-envio/callback"
            # Etiqueta automática no Melhor Envio: só liga com os dados do remetente preenchidos e o saldo da conta carregado.
            - name: MELHOR_ENVIO_AUTO_LABEL
              value: "false"
            - name: MELHOR_ENVIO_SENDER_NAME
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MELHOR_ENVIO_SENDER_NAME
                  optional: true
            - name: MELHOR_ENVIO_SENDER_PHONE
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MELHOR_ENVIO_SENDER_PHONE
                  optional: true
            - name: MELHOR_ENVIO_SENDER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MELHOR_ENVIO_SENDER_EMAIL
                  optional: true
            - name: MELHOR_ENVIO_SENDER_DOCUMENT
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MELHOR_ENVIO_SENDER_DOCUMENT
                  optional: true
            - name: MELHOR_ENVIO_SENDER_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MELHOR_ENVIO_SENDER_ADDRESS
                  optional: true
            - name: MELHOR_ENVIO_SENDER_NUMBER
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MELHOR_ENVIO_SENDER_NUMBER
                  optional: true
            - name: MELHOR_ENVIO_SENDER_DISTRICT
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MELHOR_ENVIO_SENDER_DISTRICT
                  optional: true
            - name: MELHOR_ENVIO_SENDER_CITY
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MELHOR_ENVIO_SENDER_CITY
                  optional: true
            - name: MELHOR_ENVIO_SENDER_STATE
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MELHOR_ENVIO_SENDER_STATE
                  optional: true
            - name: MELHOR_ENVIO_SENDER_COMPLEMENT
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MELHOR_ENVIO_SENDER_COMPLEMENT
                  optional: true
            - name: MELHOR_ENVIO_FROM_ZIP
              value: "06365210"
            # Conexões por réplica. Réplicas x este valor precisa ficar abaixo do max_connections do PostgreSQL menos o que os
            # outros apps usam (hoje ~20); o ajuste do banco no repo de infra sobe o limite para 150.
            - name: DB_POOL_MAX
              value: "15"
            - name: STORE_CORS
              value: "https://homolog.tyershop.com,https://tyershop.com,https://www.tyershop.com"
            - name: ADMIN_CORS
              value: "https://medusa.homolog.tyershop.com"
            - name: AUTH_CORS
              value: "https://homolog.tyershop.com,https://tyershop.com,https://www.tyershop.com,https://medusa.homolog.tyershop.com"
            - name: AWS_BUCKET
              value: tyershop
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              value: tyershop
            - name: AWS_ENDPOINT
              value: http://minio.shared.svc.cluster.local:9000
            - name: AWS_URL
              # URL interna do cluster não abre no navegador do cliente —
              # bucket tyershop é público, exposto via /cdn na api
              value: https://api.homolog.tyershop.com/cdn/tyershop
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: tyershop-backend
  namespace: apps
spec:
  selector:
    app: tyershop-backend
  ports:
    - name: http
      port: 9000
      targetPort: http
