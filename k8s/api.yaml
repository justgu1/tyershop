apiVersion: apps/v1
kind: Deployment
metadata:
  name: tyershop-api
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tyershop-api
  template:
    metadata:
      labels:
        app: tyershop-api
    spec:
      containers:
        - name: api
          image: ghcr.io/justgu1/tyershop-api:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MEDUSA_INTERNAL_URL
              value: "http://tyershop-backend.apps.svc.cluster.local:9000"
            - name: MEDUSA_URL
              value: "http://tyershop-backend.apps.svc.cluster.local:9000"
            - name: CHECKOUT_PUBLIC_BASE_URL
              value: "https://hg.tyershop.com"
            - name: CORS_ORIGIN
              value: "https://hg.tyershop.com"
            - name: MERCADOPAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: MERCADOPAGO_ACCESS_TOKEN
            - name: MEDUSA_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: PUBLIC_MEDUSA_PUBLISHABLE_KEY
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: SMTP_HOST
            - name: NEWSLETTER_FROM
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: NEWSLETTER_FROM
            - name: NEWSLETTER_TO
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: NEWSLETTER_TO
            - name: STOCK_NOTIFY_FROM
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: STOCK_NOTIFY_FROM
            - name: STOCK_NOTIFY_TO
              valueFrom:
                secretKeyRef:
                  name: tyershop-secrets
                  key: STOCK_NOTIFY_TO
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tyershop-api
  namespace: apps
spec:
  selector:
    app: tyershop-api
  ports:
    - name: http
      port: 3000
      targetPort: http
